<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a13" />
    <title>Tower Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark">◈</div>
      <p id="boot-text">Opening the store…</p>
      <button id="boot-retry" class="ghost" hidden>Try again</button>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="server">
          <div id="guild-icon" class="guild-icon">◈</div>
          <div class="server-text">
            <span class="server-label">Server</span>
            <strong id="guild-name">Store</strong>
          </div>
        </div>
        <div class="wallet" aria-label="Your balance">
          <img class="coin-icon" src="assets/coin.png" alt="" aria-hidden="true" />
          <span id="balance">0</span>
        </div>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">Tower Store</p>
          <h1>Spend your coins</h1>
          <p class="sub">Levels earn coins. Turn them into upgrades.</p>
        </div>
        <div id="user-chip" class="user-chip">
          <img id="avatar" alt="" />
          <div class="user-text">
            <span id="user-name">Member</span>
            <small id="user-level">Level 1</small>
          </div>
        </div>
      </section>

      <nav id="tabs" class="tabs" aria-label="Store categories"></nav>
      <main id="grid" class="grid"></main>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </div>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <button class="sheet-close" data-close aria-label="Close">×</button>
        <div id="sheet-art" class="sheet-art"></div>
        <div class="sheet-body">
          <span id="sheet-rarity" class="rarity"></span>
          <h2 id="sheet-title"></h2>
          <p id="sheet-summary" class="sheet-summary"></p>
          <div id="sheet-controls" class="sheet-controls"></div>
          <div id="sheet-admin" class="sheet-admin"></div>
          <button id="sheet-action" class="primary"></button>
          <p id="sheet-note" class="sheet-note"></p>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
