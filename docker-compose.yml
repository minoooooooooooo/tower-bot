services:
  bot:
    build: .
    image: discord-bot:latest
    container_name: discord-bot

    # Brings the bot back after crashes and after the VM reboots.
    restart: always

    # PID 1 helper: forwards SIGTERM to Node so the graceful shutdown runs.
    init: true
    stop_grace_period: 15s

    env_file:
      - .env

    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

    # Plain bot operation needs no inbound ports - it only opens outbound
    # connections. Uncomment the block below only when the Store Activity is
    # enabled (ACTIVITY_ENABLED=1) and something on the host - a reverse proxy or
    # tunneler - forwards HTTPS to it. See docs/activity-store.md.
    #
    # ports:
    #   - "127.0.0.1:3000:3000"

    # Persists bot.db across container rebuilds.
    volumes:
      - bot-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    # Comfortable ceiling for a 1 GB micro instance.
    mem_limit: 512m

volumes:
  bot-data:
